%YAML 1.3
# Feature argument spellings. Solaar's Feature.data() writes str(SupportedFeature.X), which is the
# enum name with "_" replaced by " ". 1.1.14 loads with SupportedFeature[name] (underscores only);
# 1.1.20 loads with SupportedFeature[name.replace(" ", "_")] (either spelling).
---
- Feature: THUMB_WHEEL
- Test: thumb_wheel_up
- MouseScroll: [0, 1]
...
---
- Feature: THUMB WHEEL
- Test: thumb_wheel_down
- MouseScroll: [0, -1]
...
---
- Feature: CROWN
- Test: crown_tap
- KeyPress: XF86_AudioMute
...
